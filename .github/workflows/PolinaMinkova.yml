name: GitHub Actions Demo
on:
  push:
    branch: 
      - main
  permissions:
    contents: read
jobs:
  run_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: 
          python-version: "3.12"
      - run: pip install -r services/tasks-api/requirements.txt
      - run: pytest services/tasks-api
